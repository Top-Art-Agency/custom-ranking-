<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<title>Żabkowe Mistrzostwa w Triki — Wpisywanie wyników</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Orbitron:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 900px 520px at 12% -8%, rgba(236,72,153,.18), transparent 60%),
    radial-gradient(ellipse 950px 620px at 102% 8%, rgba(59,130,246,.16), transparent 60%),
    #07050f;
  color:#f5f3ff;font-family:'Nunito',sans-serif;min-height:100vh;padding:20px 16px 60px;
}
.wrap{max-width:640px;margin:0 auto}
.hdr{margin-bottom:20px}
.hdr .sub{font-size:.65rem;color:#8a86ad;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.hdr h1{font-family:'Baloo 2',sans-serif;font-size:1.7rem;font-weight:800;margin-top:2px;
  background-image:linear-gradient(90deg,#f9a8d4,#c084fc,#60a5fa,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#a3a3c2;font-weight:800;font-size:.85rem;cursor:pointer}
.tab.active{color:#fff;border-color:var(--c);background:rgba(255,255,255,.07);box-shadow:0 0 3px var(--c),0 0 16px var(--c)}
.icon-badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--c);box-shadow:0 0 6px var(--c);color:var(--c);overflow:hidden;width:20px;height:20px}
.icon-badge svg{width:58%;height:58%;filter:drop-shadow(0 0 2px currentColor)}
.icon-badge img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.panel{background:#12102a;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:20px}
.panel h2{font-family:'Baloo 2',sans-serif;font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.field{margin-bottom:12px}
.field label{font-size:.72rem;color:#8a86ad;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.field input,.field select{
  width:100%;margin-top:5px;background:#0b0a1c;border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:11px 12px;color:#f5f3ff;font-family:'Nunito';font-size:16px;font-weight:700;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--c)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:.8rem;margin-top:8px;min-height:16px;font-weight:700}
.msg.ok{color:#4ade80}
.msg.err{color:#ff8484}
.submit{
  width:100%;margin-top:6px;padding:13px;border:none;border-radius:10px;cursor:pointer;
  font-family:'Orbitron';font-weight:800;font-size:.85rem;letter-spacing:.03em;
  background:linear-gradient(90deg,var(--c),#fff2);color:#0b0a1c;background-color:var(--c);
}
.submit:active{transform:scale(.98)}

.list h2{font-family:'Baloo 2',sans-serif;font-size:.95rem;color:#8a86ad;margin-bottom:10px}
.entry{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 13px;margin-bottom:7px}
.entry .nm{flex:1;font-weight:800;font-size:.95rem}
.entry .rd{font-size:.68rem;color:#7d7d9c;background:rgba(255,255,255,.05);border-radius:8px;padding:2px 7px;margin-left:6px}
.entry .sc{font-family:'Orbitron';font-weight:900;color:var(--c);font-size:1rem}
.entry .del{background:none;border:none;color:#6d6d8f;font-size:1rem;cursor:pointer;padding:2px 7px}
.entry .del:hover{color:#ff5d7a}
.empty2{color:#5a5a7d;font-size:.85rem;text-align:center;padding:16px}
.loading{color:#5a5a7d;font-size:.8rem;text-align:center;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="sub">Żabkowe Mistrzostwa w Triki</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <h1>Wpisywanie wyników</h1>
      <button id="reportBtn" style="flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#f5f3ff;border-radius:10px;padding:9px 16px;font-family:'Nunito';font-weight:800;font-size:.85rem;cursor:pointer">📄 Pobierz raport (CSV)</button>
    </div>
  </div>
  <div id="reportMsg" style="font-size:.78rem;color:#8a86ad;margin:-10px 0 16px;min-height:14px"></div>

  <div class="tabs" id="tabs"></div>

  <div class="panel" id="formPanel"></div>

  <div class="list">
    <h2 id="listTitle">Aktualne wyniki</h2>
    <div id="listBody"><div class="loading">Ładowanie…</div></div>
  </div>
</div>

<script>
/* Ta sama baza co w tablicy TV — zmieniaj tu i tam razem, jeśli kiedyś się zmieni. */
const DB = 'https://triki-ranking-2-default-rtdb.europe-west1.firebasedatabase.app';

/* Te same loga co na tablicy TV — jeśli podmienisz w pliku TV, podmień i tu, żeby wyglądało spójnie. */
const LOGOS = {
  ninja:    'https://triki.zabka.pl/images/game-image-Ninja%20Frog.png',
  bokser:   'https://triki.zabka.pl/images/game-image-Boxer.png',
  toss:     'https://triki.zabka.pl/images/game-image-Toss.png',
  snake:    'https://triki.zabka.pl/images/game-image-Snake.png',
  snake1v1: 'https://triki.zabka.pl/images/game-image-Snake_1vs1.png',
  pilka:    'https://triki.zabka.pl/images/game-image-Pilka-nozna.png',
  galaxy:   ''
};
const DEFAULT_ICONS = {
  ninja: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c0-3 3-6 8-6s8 3 8 6"/><circle cx="8" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9" r="1.3" fill="currentColor" stroke="none"/><path d="M3 9l3-3M21 9l-3-3"/><path d="M6 13c0 4 3 7 6 7s6-3 6-7"/></svg>`,
  bokser: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V7a3 3 0 0 1 6 0v1"/><path d="M14 8a3 3 0 0 1 6 0v6c0 3-2 6-6 6H9a4 4 0 0 1-4-4v-3c0-1.5 1-2.5 2.5-2.5S10 9.5 10 11"/></svg>`,
  toss: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><path d="M18 6l3-3" stroke-linecap="round"/></svg>`,
  snake: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c2-2 4-2 5 0s-1 4 1 5 4-1 5 1-1 4 1 4"/><circle cx="4.6" cy="7.4" r="0.9" fill="currentColor" stroke="none"/></svg>`,
  snake1v1: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21L21 3"/><path d="M21 21L3 3"/><path d="M6 6h3M18 18h-3M6 18h3M18 6h-3"/></svg>`,
  pilka: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/><path d="M12 7V4M16 10l3-1M15 15l2 3M9 15l-2 3M8 10l-3-1"/></svg>`,
  galaxy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 2 4 6 4 10l-4 4-4-4c0-4 1-8 4-10z"/><circle cx="12" cy="9" r="1.3" fill="currentColor" stroke="none"/><path d="M8 14l-3 3 1 3 3-1M16 14l3 3-1 3-3-1"/><path d="M10 19l1 3M14 19l-1 3"/></svg>`
};
function iconHtml(key){
  if(LOGOS[key]) return `<img src="${LOGOS[key]}" alt="">`;
  return DEFAULT_ICONS[key] || '';
}

const GAMES = [
  {key:'ninja',    label:'Ninja Frog',   c:'#22c55e'},
  {key:'bokser',   label:'Bokser',       c:'#ef4444'},
  {key:'toss',     label:'Toss',         c:'#f59e0b'},
  {key:'snake',    label:'Snake',        c:'#10b981'},
  {key:'snake1v1', label:'Snake 1v1',    c:'#8b5cf6'},
  {key:'pilka',    label:'Piłka Nożna',  c:'#f97316'},
  {key:'galaxy',   label:'Galaxy',       c:'#3b82f6'}
];
let current = 'ninja';

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = GAMES.map(g=>
    `<button class="tab ${g.key===current?'active':''}" style="--c:${g.c}" data-key="${g.key}">
       <span class="icon-badge" style="--c:${g.c}">${iconHtml(g.key)}</span>${g.label}
     </button>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ current = btn.dataset.key; renderTabs(); renderForm(); loadList(); });
  });
}

function renderForm(){
  const g = GAMES.find(x=>x.key===current);
  const panel = document.getElementById('formPanel');
  document.getElementById('listTitle').textContent = 'Aktualne wyniki — ' + g.label;

  if(current === 'snake1v1'){
    panel.innerHTML = `
      <h2 style="color:${g.c}"><span class="icon-badge" style="--c:${g.c}">${iconHtml('snake1v1')}</span>Dodaj mecz — Snake 1v1</h2>
      <div class="row2">
        <div class="field"><label>Zwycięzca</label><input id="f-winner" placeholder="np. Kasia"></div>
        <div class="field"><label>Przegrany</label><input id="f-loser" placeholder="np. Tomek"></div>
      </div>
      <button class="submit" style="--c:${g.c}" id="submitBtn">Dodaj mecz</button>
      <div class="msg" id="msg"></div>`;
  }else{
    panel.innerHTML = `
      <h2 style="color:${g.c}"><span class="icon-badge" style="--c:${g.c}">${iconHtml(current)}</span>Dodaj wynik — ${g.label}</h2>
      <div class="field"><label>Nick gracza</label><input id="f-name" placeholder="np. ShadowFox"></div>
      <div class="row2">
        <div class="field"><label>Wynik</label><input id="f-score" type="number" placeholder="np. 1250"></div>
        <div class="field"><label>Nr jury (opcjonalnie)</label><input id="f-jury" type="number" placeholder="np. 2"></div>
      </div>
      <button class="submit" style="--c:${g.c}" id="submitBtn">Dodaj wynik</button>
      <div class="msg" id="msg"></div>`;
  }

  document.getElementById('submitBtn').addEventListener('click', submitEntry);
}

async function submitEntry(){
  const g = GAMES.find(x=>x.key===current);
  const msg = document.getElementById('msg');
  msg.textContent=''; msg.className='msg';

  let payload;
  if(current === 'snake1v1'){
    const winner = document.getElementById('f-winner').value.trim();
    const loser = document.getElementById('f-loser').value.trim();
    if(!winner || !loser){ msg.textContent='Podaj obu zawodników.'; msg.className='msg err'; return; }
    if(winner === loser){ msg.textContent='Zwycięzca i przegrany muszą się różnić.'; msg.className='msg err'; return; }
    payload = { winner, loser };
  }else{
    const name = document.getElementById('f-name').value.trim();
    const score = Number(document.getElementById('f-score').value);
    if(!name || !document.getElementById('f-score').value || isNaN(score)){
      msg.textContent='Podaj nick i poprawny wynik.'; msg.className='msg err'; return;
    }
    payload = { name, score };
    const juryEl = document.getElementById('f-jury');
    if(juryEl && juryEl.value) payload.jury = Number(juryEl.value);
  }

  try{
    const res = await fetch(`${DB}/${current}.json`, { method:'POST', body: JSON.stringify(payload) });
    if(!res.ok) throw new Error('HTTP '+res.status);
    msg.textContent = 'Dodano ✓'; msg.className='msg ok';
    ['f-name','f-score','f-winner','f-loser'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    loadList();
  }catch(e){
    msg.textContent = 'Nie udało się zapisać — sprawdź połączenie lub reguły zapisu w Firebase.'; msg.className='msg err';
  }
}

async function loadList(){
  const g = GAMES.find(x=>x.key===current);
  const body = document.getElementById('listBody');
  body.innerHTML = '<div class="loading">Ładowanie…</div>';
  let val;
  try{
    const res = await fetch(`${DB}/${current}.json?_ts=${Date.now()}`, {cache:'no-store'});
    val = await res.json();
  }catch(e){
    body.innerHTML = '<div class="empty2">Nie udało się pobrać listy.</div>';
    return;
  }
  if(!val){ body.innerHTML = '<div class="empty2">Brak wpisów.</div>'; return; }

  const items = Object.entries(val);
  if(current === 'snake1v1'){
    items.sort((a,b)=> (b[1].ts||0)-(a[1].ts||0));
    body.innerHTML = items.map(([id,e])=>`
      <div class="entry">
        <span class="nm">🏆 ${escapeHtml(e.winner||'?')} <span style="color:#6d6d8f;font-weight:600">vs</span> ${escapeHtml(e.loser||'?')}</span>
        <button class="del" data-id="${id}" title="Usuń">✕</button>
      </div>`).join('');
  }else{
    items.sort((a,b)=> (b[1].score||0)-(a[1].score||0));
    body.innerHTML = items.map(([id,e])=>`
      <div class="entry">
        <span class="nm">${escapeHtml(e.name||'?')}${e.round?`<span class="rd">${e.round}</span>`:''}${e.jury?`<span class="rd">🐸 jury ${e.jury}</span>`:''}</span>
        <span class="sc" style="--c:${g.c}">${e.score}</span>
        <button class="del" data-id="${id}" title="Usuń">✕</button>
      </div>`).join('');
  }

  body.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.dataset.id));
  });
}

async function deleteEntry(id){
  if(!confirm('Usunąć ten wpis?')) return;
  try{
    await fetch(`${DB}/${current}/${id}.json`, { method:'DELETE' });
    loadList();
  }catch(e){
    alert('Nie udało się usunąć wpisu.');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function downloadReport(){
  const btn = document.getElementById('reportBtn');
  const rmsg = document.getElementById('reportMsg');
  btn.disabled = true; btn.textContent = '📄 Zbieram dane…';
  rmsg.textContent = '';

  try{
    const rows = [['Gra','Miejsce','Nick / Zwycięzca','Przegrany','Wynik','Tura','Jury']];

    for(const g of GAMES){
      const res = await fetch(`${DB}/${g.key}.json?_ts=${Date.now()}`, {cache:'no-store'});
      const val = await res.json();
      if(!val) continue;
      const items = Object.values(val);

      if(g.key === 'snake1v1'){
        items.sort((a,b)=> (b.ts||0)-(a.ts||0));
        items.forEach(e=>{
          rows.push([g.label, '', e.winner||'', e.loser||'', '', '', '']);
        });
      }else{
        items.sort((a,b)=> (b.score||0)-(a.score||0));
        items.forEach((e,i)=>{
          rows.push([g.label, i+1, e.name||'', '', e.score ?? '', e.round||'', e.jury ?? '']);
        });
      }
    }

    if(rows.length === 1){
      rmsg.textContent = 'Brak jakichkolwiek wyników do wyeksportowania.';
      btn.disabled = false; btn.textContent = '📄 Pobierz raport (CSV)';
      return;
    }

    const csv = '\uFEFF' + rows.map(r =>
      r.map(v => {
        const s = String(v ?? '');
        return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(';')
    ).join('\r\n');

    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    a.href = url;
    a.download = `raport-triki-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    rmsg.textContent = 'Pobrano raport ✓';
  }catch(e){
    rmsg.textContent = 'Nie udało się wygenerować raportu — sprawdź połączenie.';
  }finally{
    btn.disabled = false; btn.textContent = '📄 Pobierz raport (CSV)';
  }
}
document.getElementById('reportBtn').addEventListener('click', downloadReport);

renderTabs();
renderForm();
loadList();
</script>
</body>
</html>
